# Vision-enabled RAG: retrieved images are sent to a vision-capable LLM.
rag:
  llm:
    llm_name: Qwen/Qwen2.5-VL-3B-Instruct
    provider: HF
    max_new_tokens: 1200
    use_vision: true
  retriever:
    db:
      uri: ./proc_demo.db
      name: 'my_db'
    hybrid_search_weight: 0.5
    k: 5
  max_images_per_request: 20
  system_prompt: "Use the following context and the retrieved document images to answer the question.\n\nContext:\n{context}"
mode: local
mode_args:
  input_file: examples/rag/queries.jsonl
  output_file: examples/rag/output.json
